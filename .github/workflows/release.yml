name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build Binaries
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: heic2jpg-linux-amd64
          # macOS arm64 (Apple Silicon) - use macos-14 which is native arm64
          - os: macos-14
            goos: darwin
            goarch: arm64
            binary_name: heic2jpg-darwin-arm64
          # macOS amd64 (Intel) - use macos-13 which is native x86_64
          - os: macos-13
            goos: darwin
            goarch: amd64
            binary_name: heic2jpg-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: heic2jpg-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Xcode Command Line Tools should already be available
          xcode-select --print-path || xcode-select --install

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          # MinGW is available by default on windows-latest runners
          # Just ensure gcc is in PATH
          gcc --version

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.binary_name }} ./cmd/heic2jpg

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          if not exist dist mkdir dist
          go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.binary_name }} ./cmd/heic2jpg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Move all binaries to release directory
          find artifacts -type f -exec mv {} release/ \;
          ls -lh release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

